# Hand decisions applied on top of the pinned upstream snapshots.
# catalog/catalog.py reads this file; regions.json is generated from it.
#
# Keys are our region ids (the Geofabrik download path without the continent
# and without -latest.osm.pbf), so `canada/ontario`, `germany`, `russia`.
# Every table carries a `why`. Decisions are grouped by reason, so one `why`
# covers a group of regions decided for the same reason.
#
# Sections:
#   continents     Top-level Geofabrik extracts that are continents.
#   planet         Name of the planet entry, which is not in Geofabrik's index.
#   parent         Where a region sits in the tree, when upstream is wrong or silent.
#   kind           world, continent, country, subregion or group, when depth is wrong.
#   iso            ISO 3166 codes. The first is shown; the rest are the same
#                  territory under another code, used to match OpenAddresses.
#   covers         Country codes of an extract that covers several countries whole.
#                  Used to match OpenAddresses; no single code is shown.
#   names          English display name first, then aliases for search.
#   accept_names   Upstream names flagged by the generator that are fine as they are.

[continents]
why = "Geofabrik's top-level extracts with no parent. Russia is also top level upstream but is a country, see parent.transcontinental."
ids = ["africa", "antarctica", "asia", "australia-oceania", "central-america", "europe", "north-america", "south-america"]

[planet]
why = "The planet file comes from planet.openstreetmap.org, not from Geofabrik's index."
name = "World"
aliases = ["Planet", "Earth"]

# --- Tree --------------------------------------------------------------

[parent.transcontinental]
why = "Geofabrik puts Russia at the top level with no parent because it spans Europe and Asia. A tree needs one parent; most of its people and its capital are in Europe."

[parent.transcontinental.set]
russia = "europe"

[parent.islands]
why = "Island regions Geofabrik lists as their own continent-level extract. They are parts of a country (Azores: Portugal, Canary Islands: Spain), so they browse under it. The id keeps the Geofabrik path."

[parent.islands.set]
azores = "portugal"
canary-islands = "spain"

[kind.groups]
why = "Extracts that overlap other extracts, which already cover every part of them. Kept for direct use; the CLI hides groups from browsing and search."

[kind.groups.set]
alps = "group"
britain-and-ireland = "group"
dach = "group"
great-britain = "group"
sea = "group"
south-africa-and-lesotho = "group"
us-midwest = "group"
us-northeast = "group"
us-pacific = "group"
us-south = "group"
us-west = "group"

[kind.multi-country]
why = "Extracts that hold several countries but are the only extract for at least one of them, so they must stay browsable as countries. Their countries are in covers.multi-country."

[kind.multi-country.set]
gcc-states = "country"
guernsey-jersey = "country"
haiti-and-domrep = "country"
israel-and-palestine = "country"
malaysia-singapore-brunei = "country"
senegal-and-gambia = "country"
american-oceania = "country"

# --- ISO codes ---------------------------------------------------------

[covers.multi-country]
why = "Countries each extract covers in full, checked against Geofabrik's polygons with a point in each capital. Upstream lists five GCC codes but the polygon also covers Saudi Arabia (Riyadh), so SA is added. American Oceania covers American Samoa, Guam and the Northern Mariana Islands; it covers only some US Minor Outlying Islands, so UM is left out."

[covers.multi-country.set]
american-oceania = ["AS", "GU", "MP"]
gcc-states = ["SA", "AE", "BH", "KW", "OM", "QA"]
guernsey-jersey = ["GG", "JE"]
haiti-and-domrep = ["HT", "DO"]
israel-and-palestine = ["IL", "PS"]
malaysia-singapore-brunei = ["MY", "SG", "BN"]
senegal-and-gambia = ["SN", "GM"]

[iso.wrong-upstream]
why = "Geofabrik tags several Oceania extracts with another country's code (VU for Vanuatu, MH for the Marshall Islands). These are the territories' own codes. Clipperton has no ISO 3166-1 code, only FR-CP."

[iso.wrong-upstream.set]
ile-de-clipperton = ["FR-CP"]
pitcairn-islands = ["PN"]
polynesie-francaise = ["PF", "FR-PF"]
tokelau = ["TK"]
wallis-et-futuna = ["WF", "FR-WF"]

[iso.two-codes-upstream]
why = "Upstream gives both an ISO 3166-1 and an ISO 3166-2 code for one territory. Show the one that fits the tree (3166-2 under a country, 3166-1 at country level); keep the other for matching. OpenAddresses uses vi/ and nc/ sources for these. Taiwan: OpenAddresses and the catalog use TW."

[iso.two-codes-upstream.set]
new-caledonia = ["NC", "FR-NC"]
taiwan = ["TW"]
"us/puerto-rico" = ["US-PR", "PR"]
"us/us-virgin-islands" = ["US-VI", "VI"]

[iso.french-overseas]
why = "French overseas departments under france with no code upstream (Guyane has FR-GF upstream). ISO 3166-2:FR and OpenAddresses (fr/971 to fr/976) use the department number; the ISO 3166-1 code is the same territory."

[iso.french-overseas.set]
"france/guadeloupe" = ["FR-971", "GP"]
"france/guyane" = ["FR-973", "GF", "FR-GF"]
"france/martinique" = ["FR-972", "MQ"]
"france/reunion" = ["FR-974", "RE"]
"france/mayotte" = ["FR-976", "YT"]

[iso.missing-upstream]
why = "Single territories with no code upstream that have an ISO 3166 code of their own."

[iso.missing-upstream.set]
azores = ["PT-20"]
canary-islands = ["ES-CN"]
comores = ["KM"]
isle-of-man = ["IM"]
"russia/kaliningrad" = ["RU-KGD"]
"united-kingdom/bermuda" = ["BM"]
"united-kingdom/falklands" = ["FK"]
"norway/svalbard-janmayen" = ["SJ"]
"australia/christmas-island" = ["CX"]
"australia/cocos-islands" = ["CC"]
"australia/heard-mcdonald" = ["HM"]
"australia/norfolk-island" = ["NF"]
"china/hong-kong" = ["CN-HK", "HK"]
"china/macau" = ["CN-MO", "MO"]

[iso.kosovo]
why = "Upstream gives only RS-KM. Kosovo has no ISO 3166-1 code; XK is the code in common use, and OpenAddresses files Kosovo under xk/. RS-KM is dropped: the Serbia extract does not cover Kosovo, so Serbian country-wide data should not count as partly inside it."

[iso.kosovo.set]
kosovo = ["XK"]

[iso.first-level-subdivisions]
why = "Subregions that are exactly one ISO 3166-2 subdivision, with no code upstream. Extracts that also hold a neighbour (Brandenburg with Berlin, Lower Saxony with Bremen, New South Wales with the ACT, Central Bohemia with Prague, Hebei with Beijing and Tianjin, Guangdong with Hong Kong and Macau) keep only their own code."

