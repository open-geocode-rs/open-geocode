[package]
name = "open-geocode"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Lightweight geocoding engine: build a binary Pack from OSM extracts and serve search, autocomplete, and reverse geocoding from a single Rust runtime."
repository = "https://github.com/open-geocode-rs/open-geocode"
readme = "README.md"
keywords = ["geocoding", "geocoder", "osm", "gis", "geospatial"]
categories = ["science::geo", "command-line-utilities"]
# Publish-time packaging (crates.io ~10 MB limit). Uncomment before `cargo
# publish`; verify the demo still serves once data artifacts are excluded.
# exclude = ["data/", "demo/vendor/", "docs/", "*.pmtiles"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
geo = "0.33"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
geojson = "1.0"
h3o = "0.10"
http-body-util = "0.1"
hyper = "1"
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
indicatif = "0.17"
memmap2 = "0.9"
osmpbf = "0.3"
rayon = "1.12"
rstar = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Lets Pack sections share the file mapping with Tantivy (`OwnedBytes`).
stable_deref_trait = "1.2"
tantivy = "0.25.0"
tokio = { version = "1.45", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
# Used only by the in-crate router tests to drive the Router via `oneshot`.
tower = { version = "0.5", features = ["util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
