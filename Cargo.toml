[package]
name = "open-geocode"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Lightweight geocoding engine: build a binary Pack from OSM extracts and serve search, autocomplete, and reverse geocoding from a single Rust runtime."
repository = "https://github.com/open-geocode-rs/open-geocode"
readme = "README.md"
keywords = ["geocoding", "geocoder", "osm", "gis", "geospatial"]
categories = ["science::geo", "command-line-utilities"]
exclude = ["assets/", "data/", "docs/", "*.pmtiles"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
todo = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
# The binaries and the benchmark and fixture tooling, which report a failure
# to a person rather than to a caller who matches on it. The geocoding API
# returns open_geocode::Error.
anyhow = "1.0"
# Copies a GeoJSON answer from the interactive `og` interface. Text only.
arboard = { version = "3.7.0", default-features = false, optional = true }
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
# Where `og` keeps downloaded extracts and Packs when OG_HOME is not set.
dirs = { version = "7.0.0", optional = true }
# The parser's Pack dictionaries, memory-mapped like the text index.
fst = "0.4"
# Reads gzipped address files, the form OpenAddresses publishes.
flate2 = "1.1"
# Reads a `/batches` upload as a stream of chunks. Already in the tree
# through axum.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
geo = "0.33"
geojson = "1.0"
# NFC and NFKC of search keys, and the General_Category that tells a mark,
# already in the tree through ureq's url.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_properties = "2.3"
indicatif = "0.17"
# Fuzzy dictionary lookup in the parser; the same automata Tantivy uses.
levenshtein_automata = "0.2"
# Checks a downloaded extract against the MD5 sum Geofabrik publishes.
md-5 = { version = "0.11.0", optional = true }
memmap2 = "0.9"
# The global allocator: the Windows process heap serializes many-threaded
# builds on its lock, and mimalloc's per-thread heaps do not. Version 2, the
# long-deployed line: the crate's default, version 3, crashed a Germany build
# with a null read in its arena bitmap (`mi_bitmap_try_find_and_claim`).
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
osmpbf = "0.3"
# `/metrics` of `serve`. One registry per server rather than a process-wide
# recorder, so servers in one process (the tests) keep their own counts.
prometheus-client = "0.25"
# The interactive `og` interface, drawn inline below the prompt.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"], optional = true }
rayon = "1.12"
# Per-country postcode patterns in the parser.
regex = "1.12"
rstar = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Reads a batch item as the query string its `GET` would carry, with the
# parser axum's `Query` uses. Already in the tree through axum.
serde_urlencoded = "0.7"
# Stops `og build` cleanly on Ctrl-C.
signal-hook = { version = "0.3", default-features = false, optional = true }
# Lets Pack sections share the file mapping with Tantivy (`OwnedBytes`).
stable_deref_trait = "1.2"
tantivy = "0.25.0"
# The automaton trait Tantivy's term dictionaries walk, to find the terms a
# query word may be a typo of. Tantivy's own fuzzy query has no prefix length.
tantivy-fst = "0.5"
thiserror = "2"
tokio = { version = "1.45", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
# Logs of `serve`: one line per request, under its request id.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
# The Unicode Script property: which characters the parser reads as a
# script written without spaces.
unicode-script = "0.5.7"
# Downloads OpenAddresses data for a build, and extracts in the interactive `og`
# interface.
ureq = { version = "3.4.2", features = ["json"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "preserve_order"] }
uuid = { version = "1", features = ["v4"] }
# Reads OpenAddresses collection archives without unpacking them.
zip = { version = "2.2", default-features = false, features = ["deflate"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
# Compresses build scratch blocks: 2-5x less spill disk and I/O at zstd-1
# speeds far above the scratch disk's. Already in the tree through Tantivy.
zstd = { version = "0.13", default-features = false }

# The resource probe: usable CPUs, memory and disk, and memory-map hints.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[features]
# The interactive `og` interface and its commands, with what only they use.
tui = [
    "dep:arboard",
    "dep:dirs",
    "dep:md-5",
    "dep:ratatui",
    "dep:signal-hook",
]

[[bin]]
name = "og"
path = "src/bin/og/main.rs"
required-features = ["tui"]

[dev-dependencies]
# Used only by the in-crate router tests to drive the Router via `oneshot`.
tower = { version = "0.5", features = ["util"] }
# Holds a batch result's `response` as the bytes it was sent as, so the
# contract tests compare it with its `GET` byte for byte.
serde_json = { version = "1.0", features = ["raw_value"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
