[package]
name = "open-geocode"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Lightweight geocoding engine: build a binary Pack from OSM extracts and serve search, autocomplete, and reverse geocoding from a single Rust runtime."
repository = "https://github.com/open-geocode-rs/open-geocode"
readme = "README.md"
keywords = ["geocoding", "geocoder", "osm", "gis", "geospatial"]
categories = ["science::geo", "command-line-utilities"]
# Publish-time packaging (crates.io ~10 MB limit). Uncomment before `cargo
# publish`; verify the demo still serves once data artifacts are excluded.
# exclude = ["data/", "demo/vendor/", "docs/", "*.pmtiles"]

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
# The parser's Pack dictionaries, memory-mapped like the text index.
fst = "0.4"
geo = "0.33"
geojson = "1.0"
h3o = "0.10"
indicatif = "0.17"
# Fuzzy dictionary lookup in the parser; the same automata Tantivy uses.
levenshtein_automata = "0.2"
memmap2 = "0.9"
# The global allocator: the Windows process heap serializes many-threaded
# builds on its lock, and mimalloc's per-thread heaps do not. Version 2, the
# long-deployed line: the crate's default, version 3, crashed a Germany build
# with a null read in its arena bitmap (`mi_bitmap_try_find_and_claim`).
mimalloc = { version = "0.1", default-features = false, features = ["v2"] }
osmpbf = "0.3"
rayon = "1.12"
# Per-country postcode patterns in the parser.
regex = "1.12"
rstar = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Lets Pack sections share the file mapping with Tantivy (`OwnedBytes`).
stable_deref_trait = "1.2"
tantivy = "0.25.0"
tokio = { version = "1.45", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
# The Unicode Script property: which characters the parser reads as a
# script written without spaces.
unicode-script = "0.5.7"
uuid = { version = "1", features = ["v4"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

# The resource probe: usable CPUs, memory and disk, and memory-map hints.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Used only by the in-crate router tests to drive the Router via `oneshot`.
tower = { version = "0.5", features = ["util"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
