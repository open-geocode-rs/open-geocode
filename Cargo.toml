[package]
name = "open-geocode"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
geo = "0.33"
geojson = "1.0"
h3o = "0.10"
indicatif = "0.17"
memmap2 = "0.9"
osmpbf = "0.3"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
tantivy = "0.25.0"
tokio = { version = "1.45", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
