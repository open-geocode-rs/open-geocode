# Findings accepted on purpose. Each ignore names its file and says why it is safe.
# A finding not listed here fails the zizmor job in ci.yml.
rules:
  dangerous-triggers:
    ignore:
      # pull_request_target so fork pull requests get a token that can comment, label or close.
      # None of the three checks out or runs pull request code: they read the diff, the file list
      # and the title through the API, inside actions/github-script and actions/labeler.
      - comment-cop.yml
      - pr-labels.yml
      - slop.yml
      # workflow_run on CI for main, and the build job also requires the CI run's event to be a
      # push, so only commits already on main are built and published, never a fork's branch.
      - docker.yml

  github-env:
    ignore:
      # SOURCE_DATE_EPOCH comes from `git log` on the checked-out main commit, not from user input.
      - docker.yml

  # release.yml is generated by dist and is not edited by hand. Its actions are pinned through
  # [dist.github-action-commits] in dist-workspace.toml; the findings below are in dist's template.
  excessive-permissions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
