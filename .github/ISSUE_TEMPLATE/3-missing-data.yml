name: Missing data
description: An address, street or place that og cannot find, though it exists.
labels: [bug]
body:
  - type: input
    id: what
    attributes:
      label: What is missing
      placeholder: "4 Hameau des Prés, 74300 Cluses, France"
    validations:
      required: true
  - type: input
    id: proof
    attributes:
      label: Where it exists
      description: An OSM link, an official register, or a map link.
    validations:
      required: true
  - type: input
    id: pack
    attributes:
      label: Pack
      description: Region or planet, and how it was built. Name every flag behind any number you state. That means the input .osm.pbf and its date, whether OpenAddresses was included (--openaddresses or --openaddresses-zip), --qrank, --memory-budget-mb, threads (RAYON_NUM_THREADS) and the og commit.
      placeholder: "France, OSM + BAN"
    validations:
      required: true
