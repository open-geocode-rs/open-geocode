name: Bug
description: An error, a crash, or behavior that is wrong but not a search answer.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command or request, and the error or output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest steps that show it.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: og version and OS
      placeholder: "og 0.3.0, Ubuntu 24.04 x64"
    validations:
      required: true
