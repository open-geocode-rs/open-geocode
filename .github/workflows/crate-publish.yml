name: Publish crate

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Verify the stable release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 |
            jq -er '.packages[] | select(.name == "open-geocode") | .version')
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::The release tag must match the stable version in Cargo.toml."
            exit 1
          fi

      - name: Authenticate with crates.io
        id: crates-io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish open-geocode
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: cargo publish --locked -p open-geocode
