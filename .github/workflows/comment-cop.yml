name: Comment cop

# Flags `//` comments of three or more lines a pull request adds in src/.
# AGENTS.md's own examples run to two lines, so two pass. Doc comments
# (`///`, `//!`) and groups holding a SAFETY: marker are left alone. Reads the
# diff through the API; PR code is never checked out.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: comment-cop-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment-cop:
    name: Comment cop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const pr = context.payload.pull_request;
            const MIN_LINES = 3;

            const isComment = (line) => {
              const text = line.trimStart();
              return text.startsWith('//') && !text.startsWith('///') && !text.startsWith('//!');
            };

            function groups(path, patch) {
              const found = [];
              let line = 0;
              let group = null;
              const flush = () => {
                if (group && group.lines.length >= MIN_LINES && !group.lines.some((l) => l.includes('SAFETY:'))) {
                  found.push({ path, start: group.start, end: group.end, text: group.lines.join('\n') });
                }
                group = null;
              };
              for (const raw of patch.split('\n')) {
                if (raw.startsWith('@@')) {
                  flush();
                  line = Number(/\+(\d+)/.exec(raw)?.[1] ?? 1);
                } else if (raw.startsWith('+')) {
                  if (isComment(raw.slice(1))) {
                    if (group) { group.end = line; group.lines.push(raw.slice(1)); }
                    else group = { start: line, end: line, lines: [raw.slice(1)] };
                  } else {
                    flush();
                  }
                  line++;
                } else if (raw.startsWith('-') || raw.startsWith('\\')) {
                  flush();
                } else {
                  flush();
                  line++;
                }
              }
              flush();
              return found;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            const found = files
              .filter((f) => f.status !== 'removed' && f.patch && f.filename.startsWith('src/') && f.filename.endsWith('.rs'))
              .flatMap((f) => groups(f.filename, f.patch));

            const key = (g) => crypto.createHash('sha1').update(`${g.path}\n${g.text}`).digest('hex').slice(0, 12);
            const existing = await github.paginate(github.rest.pulls.listReviewComments, {
              ...context.repo, pull_number: pr.number, per_page: 100,
            });
            const flagged = new Set(existing.map((c) => /<!-- comment-cop:(\w+) -->/.exec(c.body)?.[1]).filter(Boolean));

            for (const g of found.filter((g) => !flagged.has(key(g)))) {
              const body =
                `<!-- comment-cop:${key(g)} -->\n` +
                `This comment runs over several lines. [AGENTS.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/AGENTS.md) asks comments to say why, briefly. ` +
                'If it explains a workaround, a change to the code may say it better.';
              const params = { ...context.repo, pull_number: pr.number, commit_id: pr.head.sha, path: g.path, line: g.end, side: 'RIGHT', body };
              if (g.end > g.start) Object.assign(params, { start_line: g.start, start_side: 'RIGHT' });
              try {
                await github.rest.pulls.createReviewComment(params);
              } catch (error) {
                core.warning(`${g.path}:${g.start}-${g.end}: ${error.message}`);
              }
            }
            core.info(`${found.length} multi-line comment group(s)`);
