name: Comment cop

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment-cop:
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    concurrency:
      group: comment-cop-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Find added Rust comments
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          python3 -m venv "$RUNNER_TEMP/comment-cop"
          "$RUNNER_TEMP/comment-cop/bin/pip" install tree-sitter==0.25.2 tree-sitter-rust==0.24.2
          "$RUNNER_TEMP/comment-cop/bin/python" .github/comment_cop.py "$PR_BASE" "$PR_HEAD" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/comment-cop.md"
          cat "$RUNNER_TEMP/comment-cop.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = require('node:fs');
            const { join } = require('node:path');
            const pr = context.payload.pull_request;
            const params = { ...context.repo, issue_number: pr.number };
            const current = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
            if (current.data.head.sha !== pr.head.sha || current.data.base.ref !== pr.base.ref) return;

            const marker = '<!-- og-comment-cop -->';
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(({ user, body }) =>
              user.login === 'github-actions[bot]' && body.startsWith(marker));
            const report = readFileSync(join(process.env.RUNNER_TEMP, 'comment-cop.md'), 'utf8');
            if (!report) {
              if (existing) await github.rest.issues.deleteComment({ ...context.repo, comment_id: existing.id });
              return;
            }

            const lines = report.trimEnd().split('\n');
            let body = marker + '\n';
            for (const line of lines) {
              if (body.length + line.length > 59000) {
                const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
                body += `\n[Full report](${run})\n`;
                break;
              }
              body += line + '\n';
            }
            if (existing && existing.body !== body) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else if (!existing) {
              await github.rest.issues.createComment({ ...params, body });
            }
