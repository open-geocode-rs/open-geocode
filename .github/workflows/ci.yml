name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Detect workspace members
        id: workspace
        run: |
          has_members=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json, sys; print('true' if json.load(sys.stdin)['workspace_members'] else 'false')")
          echo "has_members=$has_members" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        if: steps.workspace.outputs.has_members == 'true'
        run: cargo fmt --check

      - name: Check lints
        if: steps.workspace.outputs.has_members == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        if: steps.workspace.outputs.has_members == 'true'
        run: cargo test --workspace
