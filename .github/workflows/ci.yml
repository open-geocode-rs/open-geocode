name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check region catalog
        run: python3 -I catalog/catalog.py check

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Check lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Check lints with the og interface
        run: cargo clippy --all-targets --all-features -- -D warnings

  zizmor:
    name: Workflow audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Fails on any finding not ignored, with a reason, in .github/zizmor.yml.
      # The token enables the online audits, such as a pinned SHA that is not on the action's repository.
      - name: Audit workflows and Dependabot config
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.32.0 --format=github .

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # One runner per shipped target's platform: Linux x64, Linux arm64,
        # macOS Apple silicon, macOS Intel, Windows x64.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Run tests
        run: cargo test --all-features

  binary-size:
    name: Binary size
    # Pull requests only. In the merge queue and on main the job is skipped,
    # and a skipped job satisfies a required check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Growth over this fraction of main's size fails unless a maintainer
      # adds the accept:space label.
      MAX_GROWTH: "0.01"
      ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'accept:space') }}

    steps:
      - name: Checkout this pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: pr

      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install the musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # The Linux release ships the musl build, so that is the one measured.
      - name: Build the shipped binary of both
        run: |
          cargo build --profile dist --bin open-geocode --target x86_64-unknown-linux-musl --manifest-path main/Cargo.toml
          cargo build --profile dist --bin open-geocode --target x86_64-unknown-linux-musl --manifest-path pr/Cargo.toml

      - name: Compare
        run: |
          main=$(stat -c %s main/target/x86_64-unknown-linux-musl/dist/open-geocode)
          pr=$(stat -c %s pr/target/x86_64-unknown-linux-musl/dist/open-geocode)
          growth=$(awk -v a="$main" -v b="$pr" 'BEGIN { printf "%.4f", (b - a) / a }')
          echo "| | main | this PR | change |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| open-geocode | $main B | $pr B | $growth |" >> "$GITHUB_STEP_SUMMARY"
          echo "open-geocode: main $main bytes, this PR $pr bytes, change $growth"
          # Compared on the exact sizes; $growth is rounded, for display only.
          if awk -v a="$main" -v b="$pr" -v m="$MAX_GROWTH" 'BEGIN { exit !((b - a) / a > m) }'; then
            if [ "$ACCEPTED" = "true" ]; then
              echo "Growth accepted by the accept:space label."
            else
              echo "::error::open-geocode grew by $growth of main's size, over $MAX_GROWTH. Cut the growth, or ask a maintainer to add the accept:space label."
              exit 1
            fi
          fi
