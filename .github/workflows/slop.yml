name: Slop

# A maintainer labels a pull request `slop`. The pull request goes to draft and
# back to ready, which starts Devin's "Slop" reviewer (its rule requires the
# label). When that review reports its status, the pull request is closed with
# the comment in .github/slop.md, linking Devin's findings. The author's
# description is left as it is.
on:
  pull_request_target:
    types: [labeled]
  status:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  start:
    name: Start the slop review
    if: github.event_name == 'pull_request_target' && github.event.label.name == 'slop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          # The Actions token may not change a pull request's draft state.
          TRIAGE_TOKEN: ${{ secrets.TRIAGE_TOKEN }}
        with:
          script: |
            const drafts = getOctokit(process.env.TRIAGE_TOKEN);
            const id = context.payload.pull_request.node_id;
            if (!context.payload.pull_request.draft) {
              await drafts.graphql(`mutation($id: ID!) { convertPullRequestToDraft(input: { pullRequestId: $id }) { clientMutationId } }`, { id });
            }
            await drafts.graphql(`mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { clientMutationId } }`, { id });

  close:
    name: Close with the findings
    if: >
      github.event_name == 'status' &&
      github.event.context == 'Devin Review / Slop' &&
      github.event.state != 'pending' &&
      github.event.sender.login == 'devin-ai-integration[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/slop.md
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { sha, target_url } = context.payload;
            const open = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', per_page: 100 });
            const pr = open.find((p) => p.head.sha === sha && p.labels.some((label) => label.name === 'slop'));
            if (!pr) {
              core.info(`no open pull request labelled slop at ${sha}`);
              return;
            }
            const devin = typeof target_url === 'string' && target_url.startsWith('https://app.devin.ai/');
            const findings = devin ? `[Devin Review / Slop](${target_url})` : 'see the **Devin Review / Slop** check on this pull request';
            const guide = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md`;
            const body = fs.readFileSync('.github/slop.md', 'utf8').replace('{{findings}}', findings).replace('{{guide}}', guide);
            await github.rest.issues.createComment({ ...context.repo, issue_number: pr.number, body });
            await github.rest.pulls.update({ ...context.repo, pull_number: pr.number, state: 'closed' });
