name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  pull_request:
    paths:
      - "src/parse/**"
      - "src/builder/osm/test_pbf.rs"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-parse:
    name: Fuzz the query parser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Twenty minutes nightly; five on a pull request, so it answers while
      # the change is still being reviewed.
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '300' || '1200' }}
    defaults:
      run:
        working-directory: fuzz

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      # Inputs earlier runs found carry over, so each night starts where the
      # last one stopped. A pull request reads main's and saves its own.
      - name: Restore the corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-fuzz_parse-${{ github.run_id }}
          restore-keys: fuzz-corpus-fuzz_parse-

      - name: Seed the corpus
        run: python3 -I seed.py

      # The fuzz crate is its own workspace; this keeps it on the versions
      # the shipped binary is built from.
      - name: Use the root lockfile
        run: cp ../Cargo.lock Cargo.lock

      # No AddressSanitizer: og's parser is safe Rust, and under the
      # sanitizer a parse is five times slower, so the time limit would mean
      # nothing.
      - name: Build
        run: cargo +nightly fuzz build --sanitizer none fuzz_parse

      # -max_len is 256 characters of up to four UTF-8 bytes; -timeout
      # catches a hang the target's own time check never returns to.
      - name: Fuzz
        run: >-
          cargo +nightly fuzz run --sanitizer none fuzz_parse --
          -max_len=1024 -timeout=10 -max_total_time="$FUZZ_SECONDS"

      - name: Shrink the corpus
        run: cargo +nightly fuzz cmin --sanitizer none fuzz_parse

      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-parse-failure
          path: fuzz/artifacts
          if-no-files-found: ignore
