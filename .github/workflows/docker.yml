name: docker

# Builds the server image and pushes it to ghcr.io/<owner>/open-geocode once CI has passed on a push
# to main, so `latest` never points at a commit that failed CI.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: { group: docker-publish, cancel-in-progress: false }

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # Under workflow_run, github.sha is the default branch tip, not the commit CI tested.
      HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Older workflow_run jobs can start later; only the current main tip should publish latest.
      - id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$main" = "$HEAD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      - id: sha
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/open-geocode
          tags: |
            type=raw,value=latest,enable=${{ steps.tip.outputs.latest == 'true' && github.ref_name == github.event.repository.default_branch }}
            type=raw,value=sha-${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ env.HEAD_SHA }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
