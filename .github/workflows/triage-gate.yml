name: Triage gate

# Acts on triage: comments what is missing, and on the first pass labels the
# pull request `triage:passed` and takes it to draft and back to ready. Devin's
# rule starts on "PR is ready" and requires that label, so its one review runs
# only on a well-formed pull request.
#
# pull_request_target, to label and comment on fork pull requests. It checks
# out main only; PR code is never checked out or run.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

# Queued, never cancelled: a run cut off between draft and ready would leave
# the pull request a draft.
concurrency:
  group: triage-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: Triage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@v7
        with:
          script: |
            const problems = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/triage.js`);
            const MARKER = '<!-- og-triage -->';
            const PASSED = 'triage:passed';
            // Fresh state: a queued run may start after the event it was for.
            const pr = (await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number })).data;
            if (pr.state !== 'open') return;
            const issue = { ...context.repo, issue_number: pr.number };
            const labels = pr.labels.map((label) => label.name);
            const found = problems({ title: pr.title, body: pr.body, labels });

            const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 });
            const mine = comments.find((comment) => comment.user.type === 'Bot' && comment.body.startsWith(MARKER));

            if (found.length) {
              const guide = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md`;
              const message = `${MARKER}\nTriage found a few things to fix before review:\n\n${found.map((p) => `- ${p}`).join('\n')}\n\nThe templates and rules are in [CONTRIBUTING.md](${guide}). This check reruns when you push or edit the description.`;
              if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body: message });
              else await github.rest.issues.createComment({ ...issue, body: message });
              if (labels.includes(PASSED)) await github.rest.issues.removeLabel({ ...issue, name: PASSED });
              return;
            }

            if (mine) await github.rest.issues.deleteComment({ ...context.repo, comment_id: mine.id });
            if (labels.includes(PASSED)) return;

            await github.rest.issues.addLabels({ ...issue, labels: [PASSED] });
            // A draft opens Devin when its author marks it ready; only a ready
            // pull request needs the round trip through draft.
            if (!pr.draft) {
              await github.graphql(`mutation($id: ID!) { convertPullRequestToDraft(input: { pullRequestId: $id }) { clientMutationId } }`, { id: pr.node_id });
              await github.graphql(`mutation($id: ID!) { markPullRequestReadyForReview(input: { pullRequestId: $id }) { clientMutationId } }`, { id: pr.node_id });
            }
