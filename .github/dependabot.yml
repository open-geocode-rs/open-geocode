# Weekly cargo bumps. A tower-http bump that fixes tower-rs/tower-http#732
# fails the canary test in src/runtime.rs, the cue to drop the .fuse() in
# tail() in src/http/jobs.rs.
#
# Cooldown: a release must be a week old before it is proposed, so a bad
# release has time to be yanked. Security updates are not held back.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope

  # Bumps the pinned SHA and its version comment together.
  # release.yml is generated by dist; its pins live in dist-workspace.toml.
  - package-ecosystem: github-actions
    directory: /
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
