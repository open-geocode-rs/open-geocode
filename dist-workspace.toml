[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl", "aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
# release-please creates the tag + GitHub Release; dist uploads binaries to it.
create-release = false

# Native ARM runner: builds the musl binary without a cross toolchain.
[dist.github-custom-runners]
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"

# Actions in the generated release.yml, pinned to a commit: a moved tag cannot change what runs.
# Dependabot skips release.yml, which dist owns; bump these by hand when upgrading dist.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
