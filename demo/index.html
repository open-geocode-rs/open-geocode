<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>open-geocode Toronto QA</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQb2H3H1QPuQX1VQlD/9aTcHn1LwD8E="
      crossorigin=""
    />
    <style>
      .leaflet-pane,
      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow,
      .leaflet-tile-container,
      .leaflet-pane > svg,
      .leaflet-pane > canvas,
      .leaflet-zoom-box,
      .leaflet-image-layer,
      .leaflet-layer {
        position: absolute;
        left: 0;
        top: 0;
      }

      .leaflet-container {
        overflow: hidden;
        position: relative;
        outline-offset: 1px;
      }

      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow {
        user-select: none;
        -webkit-user-drag: none;
      }

      .leaflet-tile {
        filter: inherit;
        visibility: hidden;
        border: 0;
      }

      .leaflet-tile-loaded {
        visibility: inherit;
      }

      .leaflet-map-pane canvas {
        z-index: 100;
      }

      .leaflet-tile-pane {
        z-index: 200;
      }

      .leaflet-overlay-pane {
        z-index: 400;
      }

      .leaflet-shadow-pane {
        z-index: 500;
      }

      .leaflet-marker-pane {
        z-index: 600;
      }

      .leaflet-tooltip-pane {
        z-index: 650;
      }

      .leaflet-popup-pane {
        z-index: 700;
      }

      .leaflet-control {
        position: relative;
        z-index: 800;
        pointer-events: auto;
      }

      .leaflet-top,
      .leaflet-bottom {
        position: absolute;
        z-index: 1000;
        pointer-events: none;
      }

      .leaflet-top {
        top: 0;
      }

      .leaflet-right {
        right: 0;
      }

      .leaflet-bottom {
        bottom: 0;
      }

      .leaflet-left {
        left: 0;
      }

      .leaflet-control-zoom {
        border: 2px solid rgb(0 0 0 / 0.18);
        border-radius: 4px;
        overflow: hidden;
      }

      .leaflet-control-zoom a {
        display: block;
        width: 30px;
        height: 30px;
        border-bottom: 1px solid #ccc;
        background: #fff;
        color: #000;
        font: bold 18px/30px Arial, sans-serif;
        text-align: center;
        text-decoration: none;
      }

      .leaflet-control-zoom a:last-child {
        border-bottom: 0;
      }

      .leaflet-popup {
        position: absolute;
        margin-bottom: 20px;
        text-align: center;
      }

      .leaflet-popup-content-wrapper {
        padding: 1px;
        border-radius: 8px;
        box-shadow: 0 3px 14px rgb(0 0 0 / 0.22);
        text-align: left;
      }

      .leaflet-popup-content {
        margin: 13px 18px;
        line-height: 1.3;
      }

      .leaflet-popup-tip-container {
        overflow: hidden;
        position: absolute;
        left: 50%;
        width: 40px;
        height: 20px;
        margin-left: -20px;
      }

      .leaflet-popup-tip {
        width: 17px;
        height: 17px;
        margin: -10px auto 0;
        transform: rotate(45deg);
        box-shadow: 0 3px 14px rgb(0 0 0 / 0.22);
      }

      .leaflet-interactive {
        cursor: pointer;
      }

      .leaflet-grab {
        cursor: grab;
      }

      .leaflet-dragging .leaflet-grab {
        cursor: grabbing;
      }

      .leaflet-control-attribution {
        margin: 0;
        padding: 0 5px;
        background: rgb(255 255 255 / 0.8);
        font-size: 11px;
      }

      .leaflet-control-attribution a {
        color: #0078a8;
      }

      :root {
        color-scheme: dark;
        --ink: #17211d;
        --panel: #f7f3ea;
        --line: #d5c9b6;
        --muted: #6d675f;
        --point: #0f8b8d;
        --centroid: #d95d39;
        --accent: #1c2f2f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        font-family:
          "Segoe UI",
          "Aptos",
          sans-serif;
        background: #111715;
      }

      #map {
        background: #dfe7df;
      }

      .panel {
        position: absolute;
        z-index: 500;
        top: 16px;
        left: 16px;
        width: min(360px, calc(100vw - 32px));
        color: var(--ink);
        background: color-mix(in srgb, var(--panel) 94%, white);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 14px 42px rgb(28 47 47 / 0.22);
        overflow: visible;
      }

      .panel header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid var(--line);
        background: #fffbf0;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 19px;
        font-weight: 700;
        line-height: 1.15;
      }

      .subhead {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .search-wrap {
        position: relative;
        padding: 12px 14px;
        border-bottom: 1px solid var(--line);
        background: #fffaf0;
      }

      .search-box {
        position: relative;
        display: grid;
        grid-template-columns: 22px 1fr 24px;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid #cfc2ad;
        border-radius: 999px;
        background: #fffefa;
        box-shadow: 0 3px 12px rgb(28 47 47 / 0.08);
      }

      .search-box:focus-within {
        border-color: #9d8f78;
        box-shadow: 0 5px 18px rgb(28 47 47 / 0.14);
      }

      .search-icon {
        width: 16px;
        height: 16px;
        color: #6a655c;
      }

      #search-input {
        min-width: 0;
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
      }

      #search-input::placeholder {
        color: #858077;
      }

      .clear-search {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: #6a655c;
        font-size: 18px;
        line-height: 1;
      }

      .clear-search:hover {
        background: #eee5d6;
        color: var(--ink);
      }

      .clear-search[hidden] {
        display: none;
      }

      .suggestions {
        position: absolute;
        z-index: 1200;
        top: 62px;
        left: 14px;
        right: 14px;
        max-height: min(320px, calc(100vh - 190px));
        margin: 0;
        padding: 6px 0;
        overflow-y: auto;
        border: 1px solid #cfc2ad;
        border-radius: 8px;
        background: #fffefa;
        box-shadow: 0 18px 40px rgb(28 47 47 / 0.2);
        list-style: none;
      }

      .suggestions[hidden] {
        display: none;
      }

      .suggestion {
        display: grid;
        grid-template-columns: 28px 1fr;
        gap: 9px;
        width: 100%;
        min-height: 48px;
        padding: 8px 12px;
        border: 0;
        background: transparent;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }

      .suggestion:hover,
      .suggestion[aria-selected="true"] {
        background: #f2eadc;
      }

      .suggestion-pin {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        margin-top: 2px;
        border-radius: 50%;
        background: #eef5f2;
        color: #166a64;
      }

      .suggestion-pin::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }

      .suggestion-main {
        min-width: 0;
      }

      .suggestion-label {
        overflow: hidden;
        font-size: 13px;
        line-height: 1.25;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .suggestion-meta {
        margin-top: 3px;
        overflow: hidden;
        color: var(--muted);
        font-size: 11px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .point {
        background: var(--point);
      }

      .centroid {
        background: var(--centroid);
      }

      .search-wrap button {
        min-height: 0;
        width: auto;
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        color: var(--ink);
        background: #fffaf0;
      }

      .popup-title {
        max-width: 260px;
        margin: 0 0 7px;
        font-weight: 700;
        line-height: 1.25;
      }

      .popup-meta {
        display: grid;
        gap: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 560px) {
        .panel {
          top: 10px;
          left: 10px;
          width: calc(100vw - 20px);
        }

        .suggestion-label {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Toronto address QA map"></div>

    <aside class="panel" aria-label="Dataset summary">
      <header>
        <h1>Ontario Address QA</h1>
        <div class="subhead">Toronto subset over OpenStreetMap tiles</div>
      </header>
      <section class="search-wrap" aria-label="Address search">
        <div class="search-box">
          <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path
              d="m21 21-4.2-4.2m1.2-5.3a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z"
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
            />
          </svg>
          <input
            id="search-input"
            type="search"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search addresses"
            aria-autocomplete="list"
            aria-controls="suggestions"
            aria-expanded="false"
          />
          <button id="clear-search" class="clear-search" type="button" aria-label="Clear search" hidden>
            &times;
          </button>
        </div>
        <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
      </section>
    </aside>

    <script src="./data/toronto-addresses.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const records = window.OPEN_GEOCODE_TORONTO_RECORDS ?? [];
      const searchInput = document.querySelector("#search-input");
      const clearSearch = document.querySelector("#clear-search");
      const suggestionsList = document.querySelector("#suggestions");
      const layer = L.layerGroup();
      const renderer = L.canvas({ padding: 0.5 });
      const markerById = new Map();
      let activeSuggestion = -1;
      let currentSuggestions = [];

      const map = L.map("map", {
        preferCanvas: true,
        zoomControl: false,
      }).setView([43.6532, -79.3832], 11);

      L.control.zoom({ position: "bottomright" }).addTo(map);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      layer.addTo(map);

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function precisionOf(record) {
        return record.precision ?? record.p;
      }

      function normalizeSearch(value) {
        return String(value)
          .toLocaleLowerCase()
          .replace(/[^\p{L}\p{N}\s]/gu, " ")
          .split(/\s+/)
          .filter(Boolean)
          .join(" ");
      }

      function suggestionScore(record, query) {
        const label = normalizeSearch(record.label);
        const tokens = query.split(" ").filter(Boolean);
        if (tokens.length === 0) return 0;
        if (!tokens.every((token) => label.includes(token))) return 0;
        if (label === query) return 100;
        if (label.startsWith(query)) return 80;
        if (label.includes(` ${query}`)) return 60;
        return 30;
      }

      function findSuggestions(query) {
        const normalized = normalizeSearch(query);
        if (normalized.length < 2) return [];

        return records
          .map((record) => ({ record, score: suggestionScore(record, normalized) }))
          .filter((item) => item.score > 0)
          .sort((a, b) => b.score - a.score || a.record.label.localeCompare(b.record.label))
          .slice(0, 7)
          .map((item) => item.record);
      }

      function renderSuggestions(items) {
        currentSuggestions = items;
        activeSuggestion = items.length > 0 ? 0 : -1;
        suggestionsList.replaceChildren();

        if (items.length === 0) {
          suggestionsList.hidden = true;
          searchInput.setAttribute("aria-expanded", "false");
          return;
        }

        for (const [index, record] of items.entries()) {
          const option = document.createElement("li");
          option.id = `suggestion-${index}`;
          option.className = "suggestion";
          option.role = "option";
          option.setAttribute("aria-selected", String(index === activeSuggestion));
          option.innerHTML = `
            <span class="suggestion-pin" aria-hidden="true"></span>
            <span class="suggestion-main">
              <span class="suggestion-label">${escapeHtml(record.label)}</span>
              <span class="suggestion-meta">${escapeHtml(record.id)} &middot; ${escapeHtml(precisionOf(record))}</span>
            </span>
          `;
          option.addEventListener("mousedown", (event) => {
            event.preventDefault();
            selectRecord(record);
          });
          suggestionsList.appendChild(option);
        }

        suggestionsList.hidden = false;
        searchInput.setAttribute("aria-expanded", "true");
        searchInput.setAttribute("aria-activedescendant", `suggestion-${activeSuggestion}`);
      }

      function updateActiveSuggestion(nextIndex) {
        if (currentSuggestions.length === 0) return;
        activeSuggestion = (nextIndex + currentSuggestions.length) % currentSuggestions.length;
        for (const [index, option] of Array.from(suggestionsList.children).entries()) {
          option.setAttribute("aria-selected", String(index === activeSuggestion));
        }
        searchInput.setAttribute("aria-activedescendant", `suggestion-${activeSuggestion}`);
      }

      function hideSuggestions() {
        suggestionsList.hidden = true;
        searchInput.setAttribute("aria-expanded", "false");
        searchInput.removeAttribute("aria-activedescendant");
      }

      function selectRecord(record) {
        searchInput.value = record.label;
        clearSearch.hidden = false;
        hideSuggestions();

        const marker = markerById.get(record.id);
        map.flyTo([record.lat, record.lon], Math.max(map.getZoom(), 16), { duration: 0.45 });
        marker?.openPopup();
      }

      function paintRecords() {
        layer.clearLayers();
        markerById.clear();

        for (const record of records) {
          const precision = precisionOf(record);

          const isCentroid = precision === "centroid";
          const marker = L.circleMarker([record.lat, record.lon], {
            renderer,
            radius: isCentroid ? 3.5 : 2.4,
            stroke: true,
            weight: isCentroid ? 1.1 : 0.8,
            color: isCentroid ? "#8f2f21" : "#075f61",
            fillColor: isCentroid ? "#d95d39" : "#0f8b8d",
            fillOpacity: isCentroid ? 0.72 : 0.64,
          })
            .bindPopup(
              `<p class="popup-title">${escapeHtml(record.label)}</p>
               <div class="popup-meta">
                 <span>${escapeHtml(record.id)}</span>
                 <span>${escapeHtml(precision)} &middot; ${record.lat.toFixed(6)}, ${record.lon.toFixed(6)}</span>
               </div>`,
            )
            .addTo(layer);
          markerById.set(record.id, marker);
        }
      }

      function fitRecords() {
        if (records.length === 0) return;
        const bounds = L.latLngBounds(records.map((record) => [record.lat, record.lon]));
        map.fitBounds(bounds, { padding: [42, 42], maxZoom: 13 });
      }

      searchInput.addEventListener("input", () => {
        clearSearch.hidden = searchInput.value.length === 0;
        renderSuggestions(findSuggestions(searchInput.value));
      });
      searchInput.addEventListener("focus", () => {
        renderSuggestions(findSuggestions(searchInput.value));
      });
      searchInput.addEventListener("blur", () => {
        window.setTimeout(hideSuggestions, 120);
      });
      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "ArrowDown") {
          event.preventDefault();
          updateActiveSuggestion(activeSuggestion + 1);
        } else if (event.key === "ArrowUp") {
          event.preventDefault();
          updateActiveSuggestion(activeSuggestion - 1);
        } else if (event.key === "Enter" && activeSuggestion >= 0) {
          event.preventDefault();
          selectRecord(currentSuggestions[activeSuggestion]);
        } else if (event.key === "Escape") {
          hideSuggestions();
          searchInput.blur();
        }
      });
      clearSearch.addEventListener("click", () => {
        searchInput.value = "";
        clearSearch.hidden = true;
        hideSuggestions();
        searchInput.focus();
      });

      paintRecords();
      fitRecords();
    </script>
  </body>
</html>
