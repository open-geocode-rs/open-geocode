<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>open-geocode Demo</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQb2H3H1QPuQX1VQlD/9aTcHn1LwD8E="
      crossorigin=""
    />
    <style>
      .leaflet-pane,
      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow,
      .leaflet-tile-container,
      .leaflet-pane > svg,
      .leaflet-pane > canvas,
      .leaflet-zoom-box,
      .leaflet-image-layer,
      .leaflet-layer {
        position: absolute;
        left: 0;
        top: 0;
      }

      .leaflet-container {
        overflow: hidden;
        position: relative;
        outline-offset: 1px;
      }

      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow {
        user-select: none;
        -webkit-user-drag: none;
      }

      .leaflet-tile {
        filter: inherit;
        visibility: hidden;
        border: 0;
      }

      .leaflet-tile-loaded {
        visibility: inherit;
      }

      .leaflet-map-pane canvas {
        z-index: 100;
      }

      .leaflet-tile-pane {
        z-index: 200;
      }

      .leaflet-overlay-pane {
        z-index: 400;
      }

      .leaflet-shadow-pane {
        z-index: 500;
      }

      .leaflet-marker-pane {
        z-index: 600;
      }

      .leaflet-tooltip-pane {
        z-index: 650;
      }

      .leaflet-popup-pane {
        z-index: 700;
      }

      .leaflet-control {
        position: relative;
        z-index: 800;
        pointer-events: auto;
      }

      .leaflet-top,
      .leaflet-bottom {
        position: absolute;
        z-index: 1000;
        pointer-events: none;
      }

      .leaflet-top {
        top: 0;
      }

      .leaflet-right {
        right: 0;
      }

      .leaflet-bottom {
        bottom: 0;
      }

      .leaflet-left {
        left: 0;
      }

      .leaflet-popup {
        position: absolute;
        margin-bottom: 20px;
        text-align: center;
      }

      .leaflet-popup-content-wrapper {
        padding: 1px;
        border-radius: 8px;
        box-shadow: 0 3px 14px rgb(0 0 0 / 0.22);
        text-align: left;
      }

      .leaflet-popup-content {
        margin: 13px 18px;
        line-height: 1.3;
      }

      .leaflet-popup-tip-container {
        overflow: hidden;
        position: absolute;
        left: 50%;
        width: 40px;
        height: 20px;
        margin-left: -20px;
      }

      .leaflet-popup-tip {
        width: 17px;
        height: 17px;
        margin: -10px auto 0;
        transform: rotate(45deg);
        box-shadow: 0 3px 14px rgb(0 0 0 / 0.22);
      }

      .leaflet-interactive {
        cursor: pointer;
      }

      .leaflet-grab {
        cursor: grab;
      }

      .leaflet-dragging .leaflet-grab {
        cursor: grabbing;
      }

      .leaflet-control-attribution {
        margin: 0;
        padding: 0 5px;
        background: rgb(255 255 255 / 0.8);
        font-size: 11px;
      }

      .leaflet-control-attribution a {
        color: #0078a8;
      }

      :root {
        color-scheme: light;
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --popover: 0 0% 100%;
        --popover-foreground: 240 10% 3.9%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --accent: 240 4.8% 95.9%;
        --accent-foreground: 240 5.9% 10%;
        --border: 240 5.9% 90%;
        --input: 240 5.9% 90%;
        --ring: 240 5% 64.9%;
        --primary: 240 5.9% 10%;
        --primary-foreground: 0 0% 98%;
        --radius: 0.5rem;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #111715;
      }

      #map {
        background: #dfe7df;
      }

      .panel {
        position: absolute;
        z-index: 500;
        top: 16px;
        left: 16px;
        width: min(420px, calc(100vw - 32px));
        color: hsl(var(--popover-foreground));
        background: hsl(var(--popover));
        border: 1px solid hsl(var(--border));
        border-radius: calc(var(--radius) + 2px);
        box-shadow:
          0 18px 50px rgb(0 0 0 / 0.16),
          0 1px 2px rgb(0 0 0 / 0.08);
        overflow: hidden;
      }

      .panel:focus-within {
        border-color: hsl(var(--ring));
        box-shadow:
          0 0 0 3px hsl(var(--ring) / 0.18),
          0 18px 50px rgb(0 0 0 / 0.16),
          0 1px 2px rgb(0 0 0 / 0.08);
      }

      .command {
        display: flex;
        flex-direction: column;
        width: 100%;
        overflow: hidden;
        border-radius: inherit;
        background: hsl(var(--popover));
        color: hsl(var(--popover-foreground));
      }

      .command-input-wrapper {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 48px;
        padding: 0 12px;
      }

      .command-icon {
        flex: 0 0 auto;
        width: 16px;
        height: 16px;
        color: hsl(var(--muted-foreground));
      }

      #search-input {
        flex: 1 1 auto;
        min-width: 0;
        height: 44px;
        border: 0;
        outline: 0;
        background: transparent;
        color: hsl(var(--foreground));
        font: inherit;
        font-size: 14px;
      }

      #search-input::placeholder {
        color: hsl(var(--muted-foreground));
      }

      .command-clear {
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: calc(var(--radius) - 2px);
        background: transparent;
        color: hsl(var(--muted-foreground));
        font-size: 18px;
        line-height: 1;
        cursor: pointer;
      }

      .command-clear:hover,
      .command-clear:focus-visible {
        outline: 0;
        background: hsl(var(--accent));
        color: hsl(var(--accent-foreground));
      }

      .command-clear[hidden] {
        display: none;
      }

      .icon {
        width: 16px;
        height: 16px;
        pointer-events: none;
      }

      .spinner {
        width: 16px;
        height: 16px;
        animation: spinner-spin 1s linear infinite;
        color: hsl(var(--muted-foreground));
      }

      @keyframes spinner-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .command-list {
        max-height: min(420px, calc(100vh - 90px));
        overflow-y: auto;
      }

      .command-empty {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px 16px;
        color: hsl(var(--muted-foreground));
        font-size: 14px;
        line-height: 1.35;
      }

      .command-empty[hidden],
      .command-group[hidden],
      .command-items[hidden] {
        display: none;
      }

      .command-group {
        overflow: hidden;
        padding: 4px;
        border-top: 1px solid hsl(var(--border));
      }

      .command-group + .command-group {
        border-top: 1px solid hsl(var(--border));
      }

      .command-items {
        display: grid;
        gap: 1px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .command-item {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 56px;
        padding: 10px 8px;
        border: 0;
        border-radius: calc(var(--radius) - 2px);
        background: transparent;
        color: hsl(var(--foreground));
        text-align: left;
        cursor: pointer;
      }

      .command-item:hover,
      .command-item:focus-visible {
        outline: 0;
        background: hsl(var(--accent));
        color: hsl(var(--accent-foreground));
      }

      .command-item-icon {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: 1px solid hsl(var(--border));
        border-radius: calc(var(--radius) - 2px);
        background: hsl(var(--background));
        color: hsl(var(--muted-foreground));
      }

      .command-item-svg {
        width: 16px;
        height: 16px;
      }

      .command-item-content {
        display: grid;
        flex: 1 1 auto;
        min-width: 0;
      }

      .command-item-label {
        overflow: hidden;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.4;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .result-pin,
      .reverse-pin {
        color: hsl(var(--primary));
      }

      .reverse-item {
        cursor: default;
      }

      .reverse-item .command-item-label {
        font-weight: 400;
      }

      .reverse-item:hover,
      .reverse-item:focus-visible {
        background: transparent;
        color: hsl(var(--foreground));
      }

      .command-item-action {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        margin-left: auto;
        padding: 0;
        border: 0;
        border-radius: calc(var(--radius) - 2px);
        background: transparent;
        color: hsl(var(--muted-foreground));
        cursor: pointer;
      }

      .command-item-action:hover,
      .command-item-action:focus-visible {
        outline: 0;
        background: hsl(var(--accent));
        color: hsl(var(--accent-foreground));
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        color: hsl(var(--foreground));
        background: hsl(var(--popover));
      }

      .popup-title {
        flex: 1 1 auto;
        max-width: 260px;
        min-width: 0;
        margin: 0;
        font-weight: 400;
        line-height: 1.25;
      }

      .popup-body {
        display: flex;
        align-items: flex-start;
        gap: 10px;
      }

      .popup-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        margin: -4px -8px -4px 0;
        padding: 0;
        border: 0;
        border-radius: calc(var(--radius) - 2px);
        background: transparent;
        color: hsl(var(--muted-foreground));
        cursor: pointer;
      }

      .popup-close:hover,
      .popup-close:focus-visible {
        outline: 0;
        background: hsl(var(--accent));
        color: hsl(var(--accent-foreground));
      }

      .reverse-marker {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        color: #a52714;
      }

      .reverse-marker svg {
        width: 30px;
        height: 30px;
        filter: drop-shadow(0 2px 3px rgb(0 0 0 / 0.2));
      }

      .map-controls {
        position: absolute;
        z-index: 1000;
        right: 16px;
        bottom: 28px;
        display: grid;
        pointer-events: auto;
        overflow: hidden;
        border: 1px solid hsl(var(--border));
        border-radius: calc(var(--radius) + 2px);
        background: hsl(var(--popover));
        color: hsl(var(--popover-foreground));
        box-shadow:
          0 16px 38px rgb(0 0 0 / 0.14),
          0 1px 2px rgb(0 0 0 / 0.08);
      }

      .map-control {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        background: transparent;
        color: hsl(var(--foreground));
        cursor: pointer;
      }

      .map-control + .map-control {
        border-top: 1px solid hsl(var(--border));
      }

      .map-control:hover,
      .map-control:focus-visible {
        outline: 0;
        background: hsl(var(--accent));
        color: hsl(var(--accent-foreground));
      }

      .map-control:disabled {
        color: hsl(var(--muted-foreground));
        cursor: not-allowed;
        opacity: 0.5;
      }

      @media (max-width: 560px) {
        .panel {
          top: 10px;
          left: 10px;
          width: calc(100vw - 20px);
        }

        .command-item-label {
          white-space: normal;
        }

        .map-controls {
          right: 10px;
          bottom: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Address search map"></div>

    <aside class="panel" aria-label="Address search">
      <form id="search-form" class="command" aria-label="Address search">
        <div class="command-input-wrapper">
          <span id="search-icon" class="command-icon"></span>
          <input
            id="search-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search addresses"
            aria-controls="results"
          />
          <button id="clear-search" class="command-clear" type="button" aria-label="Clear search" hidden></button>
        </div>
        <section class="command-list" aria-live="polite">
          <div id="status" class="command-empty" hidden></div>
          <div id="reverse-panel" class="command-group reverse-command" aria-live="polite" hidden>
            <div class="command-item reverse-item" role="status">
              <span id="reverse-icon" class="command-item-icon reverse-pin"></span>
              <span class="command-item-content">
                <span id="reverse-label" class="command-item-label"></span>
              </span>
              <button
                id="clear-reverse"
                class="command-item-action"
                type="button"
                aria-label="Clear reverse result"
              ></button>
            </div>
          </div>
          <div id="results-group" class="command-group" hidden>
            <ul id="results" class="command-items" role="listbox" aria-label="Address results"></ul>
          </div>
        </section>
      </form>
    </aside>

    <div class="map-controls" aria-label="Map controls">
      <button id="zoom-in" class="map-control" type="button" aria-label="Zoom in"></button>
      <button id="zoom-out" class="map-control" type="button" aria-label="Zoom out"></button>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const searchForm = document.querySelector("#search-form");
      const searchIcon = document.querySelector("#search-icon");
      const searchInput = document.querySelector("#search-input");
      const clearSearch = document.querySelector("#clear-search");
      const statusEl = document.querySelector("#status");
      const resultsGroup = document.querySelector("#results-group");
      const resultsList = document.querySelector("#results");
      const reversePanel = document.querySelector("#reverse-panel");
      const reverseLabel = document.querySelector("#reverse-label");
      const reverseIcon = document.querySelector("#reverse-icon");
      const clearReverse = document.querySelector("#clear-reverse");
      const zoomInButton = document.querySelector("#zoom-in");
      const zoomOutButton = document.querySelector("#zoom-out");
      const layer = L.layerGroup();
      const reverseLayer = L.layerGroup();
      const renderer = L.canvas({ padding: 0.5 });
      const markerById = new Map();
      let currentSearch = null;
      let currentReverse = null;
      let searchDebounce = null;

      const map = L.map("map", {
        preferCanvas: true,
        zoomControl: false,
      }).setView([43.6532, -79.3832], 11);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      layer.addTo(map);
      reverseLayer.addTo(map);
      searchIcon.innerHTML = icon("search");
      clearSearch.innerHTML = icon("x");
      reverseIcon.innerHTML = icon("map-pin");
      clearReverse.innerHTML = icon("x");
      zoomInButton.innerHTML = icon("plus");
      zoomOutButton.innerHTML = icon("minus");

      zoomInButton.addEventListener("click", () => {
        map.zoomIn();
      });

      zoomOutButton.addEventListener("click", () => {
        map.zoomOut();
      });

      map.on("zoomend", updateZoomControls);
      updateZoomControls();

      function clearMapResults() {
        layer.clearLayers();
        markerById.clear();
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      searchInput.addEventListener("input", () => {
        const query = searchInput.value.trim();
        clearSearch.hidden = query.length === 0;
        window.clearTimeout(searchDebounce);

        if (query.length === 0) {
          clearResults();
          return;
        }

        if (query.length < 2) {
          currentSearch?.abort();
          setSearchLoading(false);
          clearMapResults();
          resultsList.replaceChildren();
          resultsGroup.hidden = true;
          resultsList.hidden = true;
          setStatus("Type at least 2 characters");
          return;
        }

        searchDebounce = window.setTimeout(() => runAutocomplete(query), 220);
      });

      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          window.clearTimeout(searchDebounce);
          currentSearch?.abort();
          setSearchLoading(false);
          searchInput.blur();
        }
      });

      searchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const query = searchInput.value.trim();
        clearSearch.hidden = query.length === 0;
        if (query.length === 0) {
          clearResults();
          return;
        }
        window.clearTimeout(searchDebounce);
        runSearch(query);
      });

      clearSearch.addEventListener("click", () => {
        searchInput.value = "";
        clearSearch.hidden = true;
        clearResults();
        searchInput.focus();
      });

      clearReverse.addEventListener("click", clearReverseResult);

      document.addEventListener(
        "click",
        (event) => {
          const clearButton = event.target.closest?.("[data-clear-reverse]");
          if (clearButton) {
            event.preventDefault();
            event.stopPropagation();
            clearReverseResult();
          }

          const popupCloseButton = event.target.closest?.("[data-close-popup]");
          if (popupCloseButton) {
            event.preventDefault();
            event.stopPropagation();
            map.closePopup();
          }
        },
        true,
      );

      map.on("click", (event) => {
        runReverse(event.latlng);
      });

      async function runAutocomplete(query) {
        currentSearch?.abort();
        const controller = new AbortController();
        currentSearch = controller;
        setSearchLoading(true);
        resultsGroup.hidden = true;
        resultsList.hidden = true;
        resultsList.replaceChildren();
        clearMapResults();
        setStatus("");

        const params = new URLSearchParams({
          q: query,
          limit: "10",
        });

        try {
          const response = await fetch(`/autocomplete?${params}`, {
            signal: controller.signal,
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error("Search unavailable");
          renderResults(payload.suggestions ?? [], {
            emptyLabel: "No suggestions",
            fitMap: false,
          });
        } catch (error) {
          if (error.name === "AbortError") return;
          clearMapResults();
          resultsGroup.hidden = true;
          resultsList.hidden = true;
          setStatus("Search unavailable");
        } finally {
          if (currentSearch === controller) {
            currentSearch = null;
            setSearchLoading(false);
          }
        }
      }

      async function runSearch(query) {
        currentSearch?.abort();
        const controller = new AbortController();
        currentSearch = controller;
        setSearchLoading(true);
        resultsGroup.hidden = true;
        resultsList.hidden = true;
        resultsList.replaceChildren();
        clearMapResults();
        setStatus("");

        const params = new URLSearchParams({
          q: query,
          limit: "10",
        });

        try {
          const response = await fetch(`/search?${params}`, {
            signal: controller.signal,
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error("Search unavailable");
          renderResults(payload.results ?? []);
        } catch (error) {
          if (error.name === "AbortError") return;
          clearMapResults();
          resultsGroup.hidden = true;
          resultsList.hidden = true;
          setStatus("Search unavailable");
        } finally {
          if (currentSearch === controller) {
            currentSearch = null;
            setSearchLoading(false);
          }
        }
      }

      function renderResults(results, options = {}) {
        const emptyLabel = options.emptyLabel ?? "No results";
        const fitMap = options.fitMap ?? true;
        resultsList.replaceChildren();
        clearMapResults();

        const pointResults = results.filter((result) => result.point);
        if (results.length === 0) {
          resultsGroup.hidden = true;
          resultsList.hidden = true;
          setStatus(emptyLabel);
          return;
        }

        setStatus("");
        resultsGroup.hidden = false;
        resultsList.hidden = false;

        for (const result of results) {
          const item = document.createElement("li");
          const button = document.createElement("button");
          button.className = "command-item";
          button.type = "button";
          button.setAttribute("role", "option");
          button.innerHTML = `
            <span class="command-item-icon result-pin" aria-hidden="true">
              ${icon("map-pin", "command-item-svg")}
            </span>
            <span class="command-item-content">
              <span class="command-item-label">${escapeHtml(result.label)}</span>
            </span>
          `;
          button.addEventListener("click", () => selectResult(result));
          item.appendChild(button);
          resultsList.appendChild(item);

          if (result.point) {
            const marker = makeMarker(result).addTo(layer);
            markerById.set(result.record_id, marker);
          }
        }

        if (!fitMap) {
          return;
        }

        if (pointResults.length === 1) {
          const { lat, lon } = pointResults[0].point;
          map.flyTo([lat, lon], Math.max(map.getZoom(), 15), { duration: 0.35 });
        } else if (pointResults.length > 1) {
          const bounds = L.latLngBounds(pointResults.map((result) => [result.point.lat, result.point.lon]));
          map.fitBounds(bounds, { padding: [42, 42], maxZoom: 13 });
        }
      }

      function makeMarker(result) {
        const { lat, lon, precision } = result.point;
        const isCentroid = precision === "centroid";
        const isRepresentative = precision === "representative_point";
        return L.circleMarker([lat, lon], {
          renderer,
          radius: isRepresentative ? 4.2 : isCentroid ? 3.5 : 2.8,
          stroke: true,
          weight: isRepresentative ? 1.2 : isCentroid ? 1.1 : 0.8,
          color: isRepresentative ? "#253f68" : isCentroid ? "#8f2f21" : "#075f61",
          fillColor: isRepresentative ? "#375e97" : isCentroid ? "#d95d39" : "#0f8b8d",
          fillOpacity: isRepresentative ? 0.78 : isCentroid ? 0.72 : 0.66,
        }).bindPopup(
          searchPopup(result.label),
          { closeButton: false },
        );
      }

      async function runReverse(latlng) {
        currentReverse?.abort();
        const controller = new AbortController();
        currentReverse = controller;
        reverseLayer.clearLayers();
        setReverseLoading(latlng);

        const origin = makeReverseOriginMarker(latlng).addTo(reverseLayer);
        origin.bindPopup(reversePopup("Searching"), { closeButton: false }).openPopup();

        const params = new URLSearchParams({
          lon: latlng.lng.toFixed(7),
          lat: latlng.lat.toFixed(7),
        });

        try {
          const response = await fetch(`/reverse?${params}`, {
            signal: controller.signal,
          });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error("Address unavailable");
          renderReverse(payload, latlng, origin);
        } catch (error) {
          if (error.name === "AbortError") return;
          renderReverseError("Address unavailable", latlng, origin);
        } finally {
          if (currentReverse === controller) {
            currentReverse = null;
          }
        }
      }

      function setReverseLoading(latlng) {
        reversePanel.hidden = false;
        reverseIcon.innerHTML = spinner("command-item-svg");
        reverseLabel.textContent = "Searching";
      }

      function renderReverse(payload, latlng, origin) {
        const result = payload.result;
        if (!result) {
          reversePanel.hidden = false;
          reverseIcon.innerHTML = icon("map-pin", "command-item-svg");
          reverseLabel.textContent = "No address found";
          origin.setPopupContent(reversePopup("No address found"));
          origin.openPopup();
          return;
        }

        reversePanel.hidden = false;
        reverseIcon.innerHTML = icon("map-pin", "command-item-svg");
        reverseLabel.textContent = result.label;

        origin.setPopupContent(reversePopup(result.label));
        origin.openPopup();

        if (result.point) {
          const targetLatLng = L.latLng(result.point.lat, result.point.lon);
          const target = makeReverseTargetMarker(result).addTo(reverseLayer);
          target.bindPopup(reversePopup(result.label), { closeButton: false });
          if (targetLatLng.distanceTo(latlng) > 1) {
            L.polyline([latlng, targetLatLng], {
              renderer,
              color: "#64748b",
              opacity: 0.42,
              weight: 1.5,
              dashArray: "3 6",
            }).addTo(reverseLayer);
          }
        }
      }

      function renderReverseError(message, latlng, origin) {
        reversePanel.hidden = false;
        reverseLabel.textContent = message;
        origin.setPopupContent(reversePopup(message));
        origin.openPopup();
      }

      function makeReverseOriginMarker(latlng) {
        return L.marker(latlng, {
          icon: makeReversePinIcon(),
        });
      }

      function makeReverseTargetMarker(result) {
        return L.circleMarker([result.point.lat, result.point.lon], {
          renderer,
          radius: 5,
          stroke: true,
          weight: 2,
          color: "#ffffff",
          fillColor: "#111827",
          fillOpacity: 0.92,
        });
      }

      function makeReversePinIcon() {
        return L.divIcon({
          className: "reverse-marker",
          html: icon("map-pin", "reverse-marker-svg"),
          iconAnchor: [16, 30],
          iconSize: [32, 32],
          popupAnchor: [0, -28],
        });
      }

      function reversePopup(title) {
        return `<div class="popup-body">
          <p class="popup-title">${escapeHtml(title)}</p>
          <button class="popup-close" type="button" aria-label="Clear reverse result" data-clear-reverse>
            ${icon("x")}
          </button>
        </div>`;
      }

      function searchPopup(title) {
        return `<div class="popup-body">
          <p class="popup-title">${escapeHtml(title)}</p>
          <button class="popup-close" type="button" aria-label="Close popup" data-close-popup>
            ${icon("x")}
          </button>
        </div>`;
      }

      function selectResult(result) {
        searchInput.value = result.label;
        clearSearch.hidden = false;
        const marker = markerById.get(result.record_id);
        if (result.point) {
          map.flyTo([result.point.lat, result.point.lon], Math.max(map.getZoom(), 16), {
            duration: 0.45,
          });
        }
        marker?.openPopup();
      }

      function clearReverseResult() {
        currentReverse?.abort();
        currentReverse = null;
        reverseLayer.clearLayers();
        reversePanel.hidden = true;
        reverseLabel.textContent = "";
        map.closePopup();
      }

      function clearResults() {
        window.clearTimeout(searchDebounce);
        currentSearch?.abort();
        setSearchLoading(false);
        clearMapResults();
        resultsList.replaceChildren();
        resultsGroup.hidden = true;
        resultsList.hidden = true;
        setStatus("");
      }

      function setStatus(message) {
        statusEl.textContent = message;
        statusEl.hidden = message.length === 0;
      }

      function setSearchLoading(isLoading) {
        searchIcon.innerHTML = isLoading ? spinner() : icon("search");
      }

      function spinner(className = "spinner") {
        return `<svg
          role="status"
          aria-label="Loading"
          class="${className} spinner"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>`;
      }

      function updateZoomControls() {
        zoomInButton.disabled = map.getZoom() >= map.getMaxZoom();
        zoomOutButton.disabled = map.getZoom() <= map.getMinZoom();
      }

      function icon(name, className = "icon") {
        const body = {
          "map-pin": `
            <path d="M20 10c0 4.9-5.1 9.3-7.1 10.8a1.5 1.5 0 0 1-1.8 0C9.1 19.3 4 14.9 4 10a8 8 0 0 1 16 0Z" />
            <circle cx="12" cy="10" r="3" />
          `,
          search: `<path d="m21 21-4.2-4.2m1.2-5.3a6.5 6.5 0 1 1-13 0 6.5 6.5 0 0 1 13 0Z" />`,
          minus: `<path d="M5 12h14" />`,
          plus: `<path d="M5 12h14" /><path d="M12 5v14" />`,
          x: `<path d="M18 6 6 18" /><path d="m6 6 12 12" />`,
        }[name] ?? "";

        return `<svg
          class="${className}"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          aria-hidden="true"
        >${body}</svg>`;
      }
    </script>
  </body>
</html>
