<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>open-geocode demo</title>
    <!-- Leaflet from CDN, pinned with Subresource Integrity (SRI) hashes so the
         browser verifies the files weren't tampered with. No build step. -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQb2H3H1QPuQX1VQlD/9aTcHn1LwD8E="
      crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="map" aria-label="Geocoding results map"></div>

    <aside class="panel" aria-label="Address search">
      <form id="form" autocomplete="off">
        <input
          id="q"
          type="text"
          placeholder="Search an address…"
          aria-label="Search addresses"
          spellcheck="false"
        />
      </form>
      <p id="status" class="status" hidden></p>
      <ul id="results" class="results" aria-label="Results"></ul>
      <p class="hint">Type to search · click the map to reverse-geocode</p>
    </aside>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="/config.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
