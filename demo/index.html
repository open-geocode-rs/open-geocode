<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>open-geocode Toronto QA</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQb2H3H1QPuQX1VQlD/9aTcHn1LwD8E="
      crossorigin=""
    />
    <style>
      .leaflet-pane,
      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow,
      .leaflet-tile-container,
      .leaflet-pane > svg,
      .leaflet-pane > canvas,
      .leaflet-zoom-box,
      .leaflet-image-layer,
      .leaflet-layer {
        position: absolute;
        left: 0;
        top: 0;
      }

      .leaflet-container {
        overflow: hidden;
        position: relative;
        outline-offset: 1px;
      }

      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow {
        user-select: none;
        -webkit-user-drag: none;
      }

      .leaflet-tile {
        filter: inherit;
        visibility: hidden;
        border: 0;
      }

      .leaflet-tile-loaded {
        visibility: inherit;
      }

      .leaflet-map-pane canvas {
        z-index: 100;
      }

      .leaflet-tile-pane {
        z-index: 200;
      }

      .leaflet-overlay-pane {
        z-index: 400;
      }

      .leaflet-shadow-pane {
        z-index: 500;
      }

      .leaflet-marker-pane {
        z-index: 600;
      }

      .leaflet-tooltip-pane {
        z-index: 650;
      }

      .leaflet-popup-pane {
        z-index: 700;
      }

      .leaflet-control {
        position: relative;
        z-index: 800;
        pointer-events: auto;
      }

      .leaflet-top,
      .leaflet-bottom {
        position: absolute;
        z-index: 1000;
        pointer-events: none;
      }

      .leaflet-top {
        top: 0;
      }

      .leaflet-right {
        right: 0;
      }

      .leaflet-bottom {
        bottom: 0;
      }

      .leaflet-left {
        left: 0;
      }

      .leaflet-control-zoom {
        border: 2px solid rgb(0 0 0 / 0.18);
        border-radius: 4px;
        overflow: hidden;
      }

      .leaflet-control-zoom a {
        display: block;
        width: 30px;
        height: 30px;
        border-bottom: 1px solid #ccc;
        background: #fff;
        color: #000;
        font: bold 18px/30px Arial, sans-serif;
        text-align: center;
        text-decoration: none;
      }

      .leaflet-control-zoom a:last-child {
        border-bottom: 0;
      }

      .leaflet-popup {
        position: absolute;
        margin-bottom: 20px;
        text-align: center;
      }

      .leaflet-popup-content-wrapper {
        padding: 1px;
        border-radius: 8px;
        box-shadow: 0 3px 14px rgb(0 0 0 / 0.22);
        text-align: left;
      }

      .leaflet-popup-content {
        margin: 13px 18px;
        line-height: 1.3;
      }

      .leaflet-popup-tip-container {
        overflow: hidden;
        position: absolute;
        left: 50%;
        width: 40px;
        height: 20px;
        margin-left: -20px;
      }

      .leaflet-popup-tip {
        width: 17px;
        height: 17px;
        margin: -10px auto 0;
        transform: rotate(45deg);
        box-shadow: 0 3px 14px rgb(0 0 0 / 0.22);
      }

      .leaflet-interactive {
        cursor: pointer;
      }

      .leaflet-grab {
        cursor: grab;
      }

      .leaflet-dragging .leaflet-grab {
        cursor: grabbing;
      }

      .leaflet-control-attribution {
        margin: 0;
        padding: 0 5px;
        background: rgb(255 255 255 / 0.8);
        font-size: 11px;
      }

      .leaflet-control-attribution a {
        color: #0078a8;
      }

      :root {
        color-scheme: dark;
        --ink: #17211d;
        --panel: #f7f3ea;
        --line: #d5c9b6;
        --muted: #6d675f;
        --point: #0f8b8d;
        --centroid: #d95d39;
        --accent: #1c2f2f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        font-family:
          "Segoe UI",
          "Aptos",
          sans-serif;
        background: #111715;
      }

      #map {
        background: #dfe7df;
      }

      .panel {
        position: absolute;
        z-index: 500;
        top: 16px;
        left: 16px;
        width: min(360px, calc(100vw - 32px));
        color: var(--ink);
        background: color-mix(in srgb, var(--panel) 94%, white);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: 0 14px 42px rgb(28 47 47 / 0.22);
        overflow: hidden;
      }

      .panel header {
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--line);
        background: #fffbf0;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 19px;
        font-weight: 700;
        line-height: 1.15;
      }

      .subhead {
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-bottom: 1px solid var(--line);
      }

      .metric {
        min-width: 0;
        padding: 12px 14px;
        border-right: 1px solid var(--line);
      }

      .metric:last-child {
        border-right: 0;
      }

      .metric strong {
        display: block;
        font-size: 16px;
        line-height: 1.1;
      }

      .metric span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
      }

      .controls {
        display: grid;
        gap: 10px;
        padding: 12px 14px 14px;
      }

      .toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        min-height: 32px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fffaf0;
        color: var(--ink);
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }

      .toggle input {
        width: 14px;
        height: 14px;
        margin: 0;
        accent-color: var(--accent);
      }

      .swatch {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }

      .point {
        background: var(--point);
      }

      .centroid {
        background: var(--centroid);
      }

      button {
        min-height: 36px;
        width: fit-content;
        padding: 7px 13px;
        border: 1px solid #182b2a;
        border-radius: 6px;
        background: #1c2f2f;
        color: #fff9ed;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      button:hover {
        background: #28403f;
      }

      .leaflet-popup-content-wrapper,
      .leaflet-popup-tip {
        color: var(--ink);
        background: #fffaf0;
      }

      .popup-title {
        max-width: 260px;
        margin: 0 0 7px;
        font-weight: 700;
        line-height: 1.25;
      }

      .popup-meta {
        display: grid;
        gap: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 560px) {
        .panel {
          top: 10px;
          left: 10px;
          width: calc(100vw - 20px);
        }

        .metrics {
          grid-template-columns: 1fr 1fr;
        }

        .metric:last-child {
          grid-column: span 2;
          border-top: 1px solid var(--line);
        }
      }
    </style>
  </head>
  <body>
    <div id="map" aria-label="Toronto address QA map"></div>

    <aside class="panel" aria-label="Dataset summary">
      <header>
        <h1>Ontario Address QA</h1>
        <div class="subhead">Toronto subset over OpenStreetMap tiles</div>
      </header>
      <section class="metrics" aria-label="Record counts">
        <div class="metric">
          <strong id="record-count">0</strong>
          <span>records</span>
        </div>
        <div class="metric">
          <strong id="point-count">0</strong>
          <span>points</span>
        </div>
        <div class="metric">
          <strong id="centroid-count">0</strong>
          <span>centroids</span>
        </div>
      </section>
      <section class="controls" aria-label="Layer controls">
        <div class="toggles">
          <label class="toggle">
            <input id="show-points" type="checkbox" checked />
            <span class="swatch point"></span>
            Point
          </label>
          <label class="toggle">
            <input id="show-centroids" type="checkbox" checked />
            <span class="swatch centroid"></span>
            Centroid
          </label>
        </div>
        <button id="fit-records" type="button">Fit Records</button>
      </section>
    </aside>

    <script src="./data/toronto-addresses.js"></script>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      const records = window.OPEN_GEOCODE_TORONTO_RECORDS ?? [];
      const pointToggle = document.querySelector("#show-points");
      const centroidToggle = document.querySelector("#show-centroids");
      const layer = L.layerGroup();
      const renderer = L.canvas({ padding: 0.5 });
      const formatter = new Intl.NumberFormat("en-US");

      const map = L.map("map", {
        preferCanvas: true,
        zoomControl: false,
      }).setView([43.6532, -79.3832], 11);

      L.control.zoom({ position: "bottomright" }).addTo(map);

      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      layer.addTo(map);

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function precisionOf(record) {
        return record.precision ?? record.p;
      }

      function paintRecords() {
        layer.clearLayers();
        const showPoints = pointToggle.checked;
        const showCentroids = centroidToggle.checked;

        for (const record of records) {
          const precision = precisionOf(record);
          if (precision === "point" && !showPoints) continue;
          if (precision === "centroid" && !showCentroids) continue;

          const isCentroid = precision === "centroid";
          L.circleMarker([record.lat, record.lon], {
            renderer,
            radius: isCentroid ? 3.5 : 2.4,
            stroke: true,
            weight: isCentroid ? 1.1 : 0.8,
            color: isCentroid ? "#8f2f21" : "#075f61",
            fillColor: isCentroid ? "#d95d39" : "#0f8b8d",
            fillOpacity: isCentroid ? 0.72 : 0.64,
          })
            .bindPopup(
              `<p class="popup-title">${escapeHtml(record.label)}</p>
               <div class="popup-meta">
                 <span>${escapeHtml(record.id)}</span>
                 <span>${escapeHtml(precision)} &middot; ${record.lat.toFixed(6)}, ${record.lon.toFixed(6)}</span>
               </div>`,
            )
            .addTo(layer);
        }
      }

      function fitRecords() {
        if (records.length === 0) return;
        const bounds = L.latLngBounds(records.map((record) => [record.lat, record.lon]));
        map.fitBounds(bounds, { padding: [42, 42], maxZoom: 13 });
      }

      const points = records.filter((record) => precisionOf(record) === "point").length;
      const centroids = records.filter((record) => precisionOf(record) === "centroid").length;
      document.querySelector("#record-count").textContent = formatter.format(records.length);
      document.querySelector("#point-count").textContent = formatter.format(points);
      document.querySelector("#centroid-count").textContent = formatter.format(centroids);

      pointToggle.addEventListener("change", paintRecords);
      centroidToggle.addEventListener("change", paintRecords);
      document.querySelector("#fit-records").addEventListener("click", fitRecords);

      paintRecords();
      fitRecords();
    </script>
  </body>
</html>
