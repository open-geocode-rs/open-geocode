<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>open-geocode Demo</title>
    <!-- `open-geocode serve --demo` hosts this UI and the API at the ROOT, so the
         mount is "/". This <base> is the single knob that declares the mount:
         every relative URL below (and app.js's relative imports + BASE-derived
         fetches) resolves under it, so the same UI also runs at a sub-path — the
         deployed demo sets href="/open-geocode/" instead. Change only this href. -->
    <base href="/" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css"
      integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="map" aria-label="Address search map"></div>

    <aside class="panel" aria-label="Address search">
      <form id="search-form" class="command" aria-label="Address search">
        <div class="command-input-wrapper">
          <span id="search-icon" class="command-icon"></span>
          <input
            id="search-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            placeholder="Search addresses in Ontario"
            aria-controls="results"
          />
          <button id="clear-search" class="command-clear" type="button" aria-label="Clear search" hidden></button>
        </div>
        <section class="command-list" aria-live="polite">
          <div id="status" class="command-empty" hidden></div>
          <div id="reverse-panel" class="command-group reverse-command" aria-live="polite" hidden>
            <div class="command-item reverse-item" role="status">
              <span id="reverse-icon" class="command-item-icon reverse-pin"></span>
              <span class="command-item-content">
                <span id="reverse-label" class="command-item-label"></span>
                <span id="reverse-coords" class="command-item-sub" hidden></span>
              </span>
              <button
                id="clear-reverse"
                class="command-item-action"
                type="button"
                aria-label="Clear reverse result"
              ></button>
            </div>
          </div>
          <div id="results-group" class="command-group" hidden>
            <ul id="results" class="command-items" role="listbox" aria-label="Address results"></ul>
          </div>
        </section>
      </form>
    </aside>

    <div class="map-controls" aria-label="Map controls">
      <button id="zoom-in" class="map-control" type="button" aria-label="Zoom in"></button>
      <button id="zoom-out" class="map-control" type="button" aria-label="Zoom out"></button>
    </div>

    <div class="brandmark" aria-label="open-geocode">Open-Geocode</div>

    <script
      src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"
      integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/pmtiles@4.4.1/dist/pmtiles.js"
      integrity="sha384-iS2/cbFYol4NsEeda4mW6N/8wPMOT6pv2eY+GNYSJRqVC4nbJECP1+mg6D2T8wT/"
      crossorigin="anonymous"
    ></script>
    <script src="config.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
