[package]
name = "bench"
version = "0.1.0"
edition = "2024"
publish = false
description = "Speed benchmark harness: drives every measurement of the geocoders under test"

# Standalone: the repository root is a single package, and this crate must not
# be pulled into it.
[workspace]

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
ureq = "3"
